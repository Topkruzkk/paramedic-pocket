<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500"><rect width="900" height="500" rx="32" fill="#0d1a2b"/><text x="40" y="55" fill="#fff" font-size="30" font-family="sans-serif" font-weight="700">Sudden Deterioration on Ventilator: DOPE</text><g font-family="sans-serif" text-anchor="middle"><g fill="#173b58"><circle cx="130" cy="210" r="70"/><circle cx="345" cy="210" r="70"/><circle cx="560" cy="210" r="70"/><circle cx="775" cy="210" r="70"/></g><g fill="#fff" font-size="40" font-weight="800"><text x="130" y="224">D</text><text x="345" y="224">O</text><text x="560" y="224">P</text><text x="775" y="224">E</text></g><g fill="#a9bdd0" font-size="17"><text x="130" y="320">Displacement</text><text x="345" y="320">Obstruction</text><text x="560" y="320">Pneumothorax</text><text x="775" y="320">Equipment</text></g><text x="450" y="405" fill="#ffc857" font-size="20">Disconnect + BVM if needed while you troubleshoot physiology and equipment</text></g></svg>
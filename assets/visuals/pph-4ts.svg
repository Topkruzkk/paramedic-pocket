<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500"><rect width="900" height="500" rx="32" fill="#0d1a2b"/><text x="40" y="55" fill="#fff" font-size="30" font-family="sans-serif" font-weight="700">Postpartum Hemorrhage: Think 4 Ts</text><g font-family="sans-serif" text-anchor="middle"><rect x="60" y="115" width="180" height="210" rx="24" fill="#4a2b31"/><text x="150" y="160" fill="#ffb5b5" font-size="28" font-weight="700">TONE</text><text x="150" y="205" fill="#fff" font-size="17">uterine atony</text><text x="150" y="245" fill="#a9bdd0" font-size="15">most common</text><rect x="260" y="115" width="180" height="210" rx="24" fill="#173b58"/><text x="350" y="160" fill="#8edcff" font-size="28" font-weight="700">TRAUMA</text><text x="350" y="205" fill="#fff" font-size="17">laceration/rupture</text><text x="350" y="245" fill="#a9bdd0" font-size="15">genital tract</text><rect x="460" y="115" width="180" height="210" rx="24" fill="#263f2f"/><text x="550" y="160" fill="#90efaf" font-size="28" font-weight="700">TISSUE</text><text x="550" y="205" fill="#fff" font-size="17">retained placenta</text><text x="550" y="245" fill="#a9bdd0" font-size="15">placental tissue</text><rect x="660" y="115" width="180" height="210" rx="24" fill="#443725"/><text x="750" y="160" fill="#ffe09a" font-size="28" font-weight="700">THROMBIN</text><text x="750" y="205" fill="#fff" font-size="17">coagulopathy</text><text x="750" y="245" fill="#a9bdd0" font-size="15">DIC/bleeding disorder</text><text x="450" y="400" fill="#ffc857" font-size="19">Recognize early → quantify bleeding → resuscitate + treat cause in parallel</text></g></svg>
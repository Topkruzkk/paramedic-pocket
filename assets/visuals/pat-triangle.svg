<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560"><rect width="900" height="560" rx="32" fill="#0d1a2b"/><text x="40" y="55" fill="#fff" font-size="30" font-family="sans-serif" font-weight="700">Pediatric Assessment Triangle (PAT)</text><polygon points="450,100 150,430 750,430" fill="#152b42" stroke="#39a8ff" stroke-width="6"/><g font-family="sans-serif" text-anchor="middle"><text x="450" y="145" fill="#8edcff" font-size="24" font-weight="700">APPEARANCE</text><text x="450" y="175" fill="#a9bdd0" font-size="17">tone • interactiveness • consolability • look/gaze • speech/cry</text><text x="245" y="390" fill="#90efaf" font-size="23" font-weight="700">WORK OF BREATHING</text><text x="655" y="390" fill="#ffb5b5" font-size="23" font-weight="700">CIRCULATION TO SKIN</text><text x="245" y="420" fill="#a9bdd0" font-size="16">sounds • position • retractions • flaring</text><text x="655" y="420" fill="#a9bdd0" font-size="16">pallor • mottling • cyanosis</text><text x="450" y="500" fill="#ffc857" font-size="20">First impression in seconds → then ABCDE</text></g></svg>
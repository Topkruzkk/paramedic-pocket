<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520"><rect width="900" height="520" rx="32" fill="#0d1a2b"/><text x="40" y="55" fill="#fff" font-size="30" font-family="sans-serif" font-weight="700">Neonatal Transition: Air → Lung → Heart Rate</text><g font-family="sans-serif" text-anchor="middle"><rect x="55" y="140" width="220" height="180" rx="24" fill="#173b58"/><text x="165" y="190" fill="#8edcff" font-size="22" font-weight="700">LUNG INFLATION</text><text x="165" y="235" fill="#fff" font-size="17">effective PPV</text><text x="165" y="275" fill="#a9bdd0" font-size="16">fluid clearance • FRC</text><path d="M280 230 H355" stroke="#58e0bb" stroke-width="8"/><polygon points="355,230 335,218 335,242" fill="#58e0bb"/><rect x="365" y="140" width="220" height="180" rx="24" fill="#263f2f"/><text x="475" y="190" fill="#90efaf" font-size="22" font-weight="700">PVR FALLS</text><text x="475" y="235" fill="#fff" font-size="17">pulmonary flow ↑</text><text x="475" y="275" fill="#a9bdd0" font-size="16">oxygenation improves</text><path d="M590 230 H665" stroke="#58e0bb" stroke-width="8"/><polygon points="665,230 645,218 645,242" fill="#58e0bb"/><rect x="675" y="140" width="170" height="180" rx="24" fill="#4a2b31"/><text x="760" y="190" fill="#ffb5b5" font-size="22" font-weight="700">HR RISES</text><text x="760" y="235" fill="#fff" font-size="17">best response marker</text><text x="760" y="275" fill="#a9bdd0" font-size="16">if not → fix ventilation</text><text x="450" y="410" fill="#ffc857" font-size="20">In newborn resuscitation, effective ventilation is the central intervention</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520"><rect width="900" height="520" rx="32" fill="#0d1a2b"/><text x="40" y="55" fill="#fff" font-size="30" font-family="sans-serif" font-weight="700">12‑Lead ECG: Coronary Territories</text><g font-family="sans-serif" font-size="22" text-anchor="middle"><rect x="55" y="100" width="245" height="130" rx="22" fill="#173b58"/><text x="177" y="140" fill="#8edcff" font-weight="700">INFERIOR</text><text x="177" y="178" fill="#fff">II • III • aVF</text><text x="177" y="210" fill="#a9bdd0" font-size="16">คิด RV involvement → V4R</text><rect x="328" y="100" width="245" height="130" rx="22" fill="#3a274f"/><text x="450" y="140" fill="#ddb7ff" font-weight="700">ANTERIOR</text><text x="450" y="178" fill="#fff">V1–V4</text><text x="450" y="210" fill="#a9bdd0" font-size="16">LAD territory</text><rect x="600" y="100" width="245" height="130" rx="22" fill="#253f30"/><text x="722" y="140" fill="#90efaf" font-weight="700">LATERAL</text><text x="722" y="178" fill="#fff">I • aVL • V5–V6</text><text x="722" y="210" fill="#a9bdd0" font-size="16">High lateral = I/aVL</text><rect x="190" y="280" width="245" height="130" rx="22" fill="#4d3025"/><text x="312" y="320" fill="#ffc19c" font-weight="700">POSTERIOR</text><text x="312" y="358" fill="#fff">V7–V9</text><text x="312" y="390" fill="#a9bdd0" font-size="16">V1–V3 reciprocal clues</text><rect x="465" y="280" width="245" height="130" rx="22" fill="#3d3030"/><text x="587" y="320" fill="#ffb5b5" font-weight="700">RIGHT VENTRICLE</text><text x="587" y="358" fill="#fff">V3R–V4R</text><text x="587" y="390" fill="#a9bdd0" font-size="16">โดยเฉพาะ inferior MI</text></g><text x="450" y="472" fill="#91a7bd" font-size="17" text-anchor="middle" font-family="sans-serif">Interpret contiguous leads + reciprocal change + clinical context</text></svg>
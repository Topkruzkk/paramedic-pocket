<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560"><rect width="900" height="560" rx="32" fill="#0d1a2b"/><text x="40" y="55" fill="#fff" font-size="30" font-family="sans-serif" font-weight="700">Toxidrome Pattern Recognition</text><g font-family="sans-serif"><rect x="55" y="100" width="365" height="170" rx="22" fill="#253f30"/><text x="80" y="140" fill="#90efaf" font-size="22" font-weight="700">CHOLINERGIC</text><text x="80" y="180" fill="#fff" font-size="17">wet • miosis • brady/bronchorrhea</text><text x="80" y="218" fill="#a9bdd0" font-size="15">secretions are often the life threat</text><rect x="480" y="100" width="365" height="170" rx="22" fill="#4a2b31"/><text x="505" y="140" fill="#ffb5b5" font-size="22" font-weight="700">ANTICHOLINERGIC</text><text x="505" y="180" fill="#fff" font-size="17">dry • hot • mydriasis • delirium</text><text x="505" y="218" fill="#a9bdd0" font-size="15">think hyperthermia + agitation</text><rect x="55" y="310" width="365" height="170" rx="22" fill="#173b58"/><text x="80" y="350" fill="#8edcff" font-size="22" font-weight="700">OPIOID</text><text x="80" y="390" fill="#fff" font-size="17">CNS depression • hypoventilation • miosis</text><text x="80" y="428" fill="#a9bdd0" font-size="15">ventilation first, naloxone as indicated</text><rect x="480" y="310" width="365" height="170" rx="22" fill="#443725"/><text x="505" y="350" fill="#ffe09a" font-size="22" font-weight="700">SYMPATHOMIMETIC</text><text x="505" y="390" fill="#fff" font-size="17">agitated • hot • tachy • hypertensive</text><text x="505" y="428" fill="#a9bdd0" font-size="15">similar to anticholinergic but usually sweaty</text></g></svg>
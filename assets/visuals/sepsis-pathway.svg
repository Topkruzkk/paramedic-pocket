<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500"><rect width="900" height="500" rx="32" fill="#0d1a2b"/><text x="40" y="55" fill="#fff" font-size="30" font-family="sans-serif" font-weight="700">Sepsis: Infection + Dysregulated Response → Organ Dysfunction</text><g font-family="sans-serif" text-anchor="middle"><rect x="70" y="150" width="180" height="140" rx="24" fill="#173b58"/><text x="160" y="205" fill="#8edcff" font-size="22" font-weight="700">INFECTION</text><text x="160" y="245" fill="#fff" font-size="16">source + host</text><path d="M255 220 H340" stroke="#58e0bb" stroke-width="8"/><polygon points="340,220 320,208 320,232" fill="#58e0bb"/><rect x="350" y="150" width="200" height="140" rx="24" fill="#443725"/><text x="450" y="195" fill="#ffe09a" font-size="21" font-weight="700">DYSREGULATION</text><text x="450" y="235" fill="#fff" font-size="16">vasodilation • leak</text><text x="450" y="265" fill="#fff" font-size="16">microcirculation</text><path d="M555 220 H640" stroke="#58e0bb" stroke-width="8"/><polygon points="640,220 620,208 620,232" fill="#58e0bb"/><rect x="650" y="150" width="180" height="140" rx="24" fill="#4a2b31"/><text x="740" y="205" fill="#ffb5b5" font-size="22" font-weight="700">ORGAN DYSFUNCTION</text><text x="740" y="245" fill="#fff" font-size="16">perfusion fails</text><text x="450" y="380" fill="#ffc857" font-size="19">Assess source + perfusion + organ function; treat time‑sensitive problems in parallel</text></g></svg>
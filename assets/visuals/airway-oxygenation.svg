<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500"><rect width="900" height="500" rx="32" fill="#0d1a2b"/><text x="40" y="55" fill="#fff" font-size="30" font-family="sans-serif" font-weight="700">Airway Management: Oxygenation ≠ Ventilation</text><g font-family="sans-serif" text-anchor="middle"><rect x="65" y="115" width="220" height="230" rx="24" fill="#173b58"/><text x="175" y="165" fill="#8edcff" font-size="24" font-weight="700">OXYGENATION</text><text x="175" y="215" fill="#fff" font-size="18">O₂ delivery</text><text x="175" y="255" fill="#a9bdd0" font-size="17">SpO₂ / PaO₂</text><text x="175" y="300" fill="#fff" font-size="17">FiO₂ • PEEP • recruitment</text><rect x="340" y="115" width="220" height="230" rx="24" fill="#263f2f"/><text x="450" y="165" fill="#90efaf" font-size="24" font-weight="700">VENTILATION</text><text x="450" y="215" fill="#fff" font-size="18">CO₂ clearance</text><text x="450" y="255" fill="#a9bdd0" font-size="17">EtCO₂ / PaCO₂</text><text x="450" y="300" fill="#fff" font-size="17">Minute ventilation</text><rect x="615" y="115" width="220" height="230" rx="24" fill="#4a2b31"/><text x="725" y="165" fill="#ffb5b5" font-size="24" font-weight="700">AIRWAY</text><text x="725" y="215" fill="#fff" font-size="18">Patency/protection</text><text x="725" y="255" fill="#a9bdd0" font-size="17">BVM • SGA • ETT</text><text x="725" y="300" fill="#fff" font-size="17">Plan A/B/C/D</text><text x="450" y="425" fill="#ffc857" font-size="20">Treat the failing physiology, not the device</text></g></svg>
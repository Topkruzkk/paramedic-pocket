<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560"><rect width="900" height="560" rx="32" fill="#0d1a2b"/><text x="40" y="55" fill="#fff" font-size="30" font-family="sans-serif" font-weight="700">Shock Phenotypes: Think Pump • Tank • Pipes • Blockage</text><g font-family="sans-serif"><g transform="translate(50,100)"><rect width="185" height="330" rx="22" fill="#173b58"/><text x="92" y="45" fill="#8edcff" font-size="22" text-anchor="middle" font-weight="700">HYPOVOLEMIC</text><text x="20" y="95" fill="#fff" font-size="18">Tank ↓</text><text x="20" y="135" fill="#a9bdd0" font-size="16">Preload ↓</text><text x="20" y="170" fill="#a9bdd0" font-size="16">SV/CO ↓</text><text x="20" y="215" fill="#fff" font-size="16">Bleeding</text><text x="20" y="250" fill="#fff" font-size="16">Fluid loss</text><text x="20" y="295" fill="#ffc857" font-size="15">Control cause first</text></g><g transform="translate(255,100)"><rect width="185" height="330" rx="22" fill="#4a2b31"/><text x="92" y="45" fill="#ffb5b5" font-size="22" text-anchor="middle" font-weight="700">CARDIOGENIC</text><text x="20" y="95" fill="#fff" font-size="18">Pump ↓</text><text x="20" y="135" fill="#a9bdd0" font-size="16">Contractility ↓</text><text x="20" y="170" fill="#a9bdd0" font-size="16">CO ↓</text><text x="20" y="215" fill="#fff" font-size="16">AMI</text><text x="20" y="250" fill="#fff" font-size="16">Myocarditis</text><text x="20" y="295" fill="#ffc857" font-size="15">Avoid blind fluids</text></g><g transform="translate(460,100)"><rect width="185" height="330" rx="22" fill="#263f2f"/><text x="92" y="45" fill="#90efaf" font-size="22" text-anchor="middle" font-weight="700">DISTRIBUTIVE</text><text x="20" y="95" fill="#fff" font-size="18">Pipes dilate</text><text x="20" y="135" fill="#a9bdd0" font-size="16">SVR ↓</text><text x="20" y="170" fill="#a9bdd0" font-size="16">Maldistribution</text><text x="20" y="215" fill="#fff" font-size="16">Sepsis</text><text x="20" y="250" fill="#fff" font-size="16">Anaphylaxis</text><text x="20" y="295" fill="#ffc857" font-size="15">Perfusion + cause</text></g><g transform="translate(665,100)"><rect width="185" height="330" rx="22" fill="#443725"/><text x="92" y="45" fill="#ffe09a" font-size="22" text-anchor="middle" font-weight="700">OBSTRUCTIVE</text><text x="20" y="95" fill="#fff" font-size="18">Flow blocked</text><text x="20" y="135" fill="#a9bdd0" font-size="16">Preload/afterload issue</text><text x="20" y="170" fill="#a9bdd0" font-size="16">CO ↓</text><text x="20" y="215" fill="#fff" font-size="16">Tension PTX</text><text x="20" y="250" fill="#fff" font-size="16">Tamponade/PE</text><text x="20" y="295" fill="#ffc857" font-size="15">Relieve obstruction</text></g><text x="450" y="500" fill="#91a7bd" font-size="18" text-anchor="middle">Shock is physiology, not just “low blood pressure”</text></g></svg>